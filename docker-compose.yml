version: "3.8"

services:
  app:
    build:
      context: ./docker/php
    volumes:
      - ./backend:/var/www/html
    networks:
      - ec-net

  web:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ec-net

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ec_app
      MYSQL_USER: ec_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - ec-net

networks:
  ec-net:

volumes:
  db-data:
